<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 Aviator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0e27;
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .crash-game-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            background: #0a0e27;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .crash-game-widget {
            width: 100%;
        }

        .crash-game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 0 5px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .crash-game-title {
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .crash-game-title .plane-icon {
            font-size: 28px;
        }

        .crash-game-round-info {
            color: #8892b0;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .user-info {
            color: #8892b0;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-info .username {
            color: #ffd93d;
            font-weight: 600;
        }

        .logout-btn {
            background: rgba(255, 71, 87, 0.15);
            color: #ff4757;
            border: 1px solid rgba(255, 71, 87, 0.2);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: rgba(255, 71, 87, 0.25);
        }

        .crash-game-multiplier {
            text-align: center;
            padding: 10px 0;
            margin-bottom: 5px;
        }

        .crash-game-multiplier .value {
            font-size: 56px;
            font-weight: 800;
            display: inline-block;
            letter-spacing: -1px;
            transition: all 0.2s ease;
        }

        .crash-game-multiplier .value .x-symbol {
            font-size: 28px;
            font-weight: 400;
            opacity: 0.5;
            margin-left: 2px;
        }

        .crash-game-multiplier .value.waiting {
            color: #8892b0;
        }

        .crash-game-multiplier .value.running {
            color: #ffd93d;
            text-shadow: 0 0 30px rgba(255, 217, 61, 0.3);
            animation: pulseMul 0.6s ease-in-out infinite alternate;
        }

        @keyframes pulseMul {
            0% { transform: scale(1); }
            100% { transform: scale(1.06); }
        }

        .crash-game-multiplier .value.crashed {
            color: #ff4757;
            text-shadow: 0 0 30px rgba(255, 71, 87, 0.3);
        }

        .crash-game-canvas {
            position: relative;
            background: #0b1026;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 15px;
            min-height: 300px;
        }

        .crash-game-canvas canvas {
            display: block;
            width: 100%;
            height: auto;
            background: #0b1026;
            min-height: 300px;
        }

        .crash-game-status {
            position: absolute;
            top: 15px;
            left: 15px;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(4px);
            z-index: 5;
        }

        .crash-game-status.waiting {
            color: #8892b0;
        }

        .crash-game-status.running {
            color: #ffd93d;
            border-color: rgba(255, 217, 61, 0.3);
        }

        .crash-game-status.crashed {
            color: #ff4757;
            border-color: rgba(255, 71, 87, 0.3);
            animation: pulse 0.5s ease infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.6; }
            to { opacity: 1; }
        }

        .crash-game-countdown {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.05);
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 3;
        }

        .crash-game-countdown.active {
            color: rgba(255, 217, 61, 0.15);
            font-size: 100px;
            animation: countdownPulse 0.5s ease infinite alternate;
        }

        @keyframes countdownPulse {
            from { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }
            to { transform: translate(-50%, -50%) scale(1.1); opacity: 0.6; }
        }

        .crash-game-panel {
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 15px;
            margin-bottom: 15px;
        }

        .crash-game-left {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .crash-game-right {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
            max-height: 200px;
        }

        .crash-game-balance {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .crash-game-balance .label {
            color: #8892b0;
            font-size: 14px;
        }

        .crash-game-balance .amount {
            color: #00d4ff;
            font-size: 20px;
            font-weight: 700;
        }

        .crash-game-balance .amount.negative {
            color: #ff4757;
        }

        .crash-game-controls {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .input-group input[type="number"] {
            flex: 1;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .input-group input[type="number"]:focus {
            border-color: #ffd93d;
        }

        .input-group input[type="number"]:disabled {
            opacity: 0.3;
        }

        .input-group input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
        }

        .btn-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .crash-game-btn {
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            flex: 1;
            min-width: 50px;
        }

        .crash-game-btn:hover:not(:disabled) {
            transform: translateY(-1px);
        }

        .crash-game-btn:active:not(:disabled) {
            transform: translateY(0px);
        }

        .crash-game-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }

        .crash-game-btn.quick {
            background: rgba(255, 255, 255, 0.06);
            color: #8892b0;
            flex: 1;
        }

        .crash-game-btn.quick:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .crash-game-btn.place {
            background: linear-gradient(135deg, #00d4ff, #0090ff);
            color: #fff;
            flex: 2;
        }

        .crash-game-btn.place:hover:not(:disabled) {
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.3);
        }

        .crash-game-btn.cashout {
            background: linear-gradient(135deg, #ffd93d, #f5a623);
            color: #0a0e27;
            flex: 2;
        }

        .crash-game-btn.cashout:hover:not(:disabled) {
            box-shadow: 0 4px 20px rgba(255, 217, 61, 0.3);
        }

        .crash-game-btn.cashout.cashing {
            animation: cashPulse 0.8s ease infinite alternate;
        }

        @keyframes cashPulse {
            from { box-shadow: 0 0 10px rgba(255, 217, 61, 0.2); }
            to { box-shadow: 0 0 30px rgba(255, 217, 61, 0.6); }
        }

        .crash-game-player-list {
            padding: 10px;
            max-height: 200px;
            overflow-y: auto;
        }

        .crash-game-player-list::-webkit-scrollbar {
            width: 4px;
        }

        .crash-game-player-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .crash-game-player-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .player-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 8px;
            border-radius: 6px;
            margin-bottom: 2px;
            background: rgba(255, 255, 255, 0.02);
            font-size: 13px;
        }

        .player-item .name {
            color: #8892b0;
        }

        .player-item .bet-amount {
            color: #fff;
            font-weight: 600;
        }

        .player-item .status-badge {
            font-size: 12px;
            padding: 2px 10px;
            border-radius: 12px;
        }

        .player-item .status-badge.waiting {
            color: #00d4ff;
        }

        .player-item .status-badge.cashed {
            color: #00d4ff;
            background: rgba(0, 212, 255, 0.1);
        }

        .player-item .status-badge.lost {
            color: #ff4757;
            background: rgba(255, 71, 87, 0.1);
        }

        .crash-game-live-bets {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px 15px;
            margin-bottom: 15px;
            max-height: 80px;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }

        .crash-game-live-bets::-webkit-scrollbar {
            width: 4px;
        }

        .crash-game-live-bets::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .crash-game-bet-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .crash-game-bet-item .player {
            color: #8892b0;
        }

        .crash-game-bet-item .status.active {
            color: #00d4ff;
        }

        .crash-game-bet-item .status.cashed {
            color: #00d4ff;
            background: rgba(0, 212, 255, 0.1);
            padding: 2px 8px;
            border-radius: 10px;
        }

        .crash-game-bet-item .status.lost {
            color: #ff4757;
            background: rgba(255, 71, 87, 0.1);
            padding: 2px 8px;
            border-radius: 10px;
        }

        .crash-game-bet-feed-empty {
            color: #8892b0;
            font-size: 13px;
            width: 100%;
            text-align: center;
        }

        .crash-game-history {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px 15px;
        }

        .crash-game-history .title {
            color: #8892b0;
            font-size: 13px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .crash-game-history .grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .crash-game-history .grid .item {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .crash-game-history .grid .item.high {
            color: #00d4ff;
            border-color: rgba(0, 212, 255, 0.2);
        }

        .crash-game-history .grid .item.low {
            color: #8892b0;
        }

        .crash-game-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 28px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            z-index: 9999;
            color: #fff;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.3s ease;
            max-width: 90%;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .crash-game-toast.success {
            background: linear-gradient(135deg, #00d4ff, #0090ff);
        }

        .crash-game-toast.error {
            background: linear-gradient(135deg, #ff4757, #c0392b);
        }

        .crash-game-toast.info {
            background: linear-gradient(135deg, #ffd93d, #f5a623);
            color: #0a0e27;
        }

        @media (max-width: 768px) {
            .crash-game-container { padding: 12px; }
            .crash-game-panel { grid-template-columns: 1fr; }
            .crash-game-multiplier .value { font-size: 40px; }
            .crash-game-header { flex-direction: column; align-items: flex-start; }
            .header-right { width: 100%; justify-content: space-between; }
            .crash-game-countdown { font-size: 50px; }
            .crash-game-countdown.active { font-size: 70px; }
            .crash-game-btn { font-size: 12px; padding: 6px 10px; min-width: 40px; }
            .crash-game-right { max-height: 150px; }
            .crash-game-live-bets { max-height: 60px; }
        }

        @media (max-width: 480px) {
            .crash-game-multiplier .value { font-size: 32px; }
            .crash-game-status { font-size: 11px; padding: 4px 12px; }
            .crash-game-balance .amount { font-size: 16px; }
            .input-group input[type="number"] { font-size: 14px; padding: 8px 10px; }
            .btn-group { gap: 4px; }
            .crash-game-btn { font-size: 11px; padding: 6px 8px; min-width: 35px; }
        }
    </style>
</head>
<body>

    <div class="crash-game-container">
        <div id="crash-game-app">
            <!-- Game will be rendered here -->
            <div id="loading-screen" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:400px;color:#8892b0;">
                <div style="width:50px;height:50px;border:4px solid rgba(255,217,61,0.1);border-top-color:#ffd93d;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
                <p style="margin-top:20px;font-size:16px;">Loading game...</p>
            </div>
        </div>
    </div>

    <style>
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <script>
         // ============================================
        // CHECK AUTHENTICATION
        // ============================================
        (async function checkAuth() {
            try {
                const response = await fetch('/api/me', { credentials: 'include' });
                if (!response.ok) {
                    window.location.href = '/login';
                    return;
                }
                const data = await response.json();
                window.currentUser = data.user;
                console.log('✅ Authenticated as:', data.user.username);
                
                // Remove loading screen and init game
                const loadingScreen = document.getElementById('loading-screen');
                if (loadingScreen) loadingScreen.style.display = 'none';
                
                initGame();
            } catch (error) {
                console.error('Auth error:', error);
                window.location.href = '/login';
            }
        })();

        // ============================================
        // LOGOUT FUNCTION
        // ============================================
        async function logout() {
            try {
                await fetch('/api/logout', { method: 'POST', credentials: 'include' });
                window.location.href = '/login';
            } catch (error) {
                console.error('Logout error:', error);
            }
        }

        // ============================================
        // GAME INITIALIZATION
        // ============================================
        function initGame() {
            'use strict';

            console.log('🎮 Initializing game...');

            const CONFIG = {
                serverUrl: window.location.origin,
                initialBalance: 1000,
                canvasHeight: 400,
                canvasWidth: 800,
                historyLimit: 20,
                MAX_POINTS: 120
            };

            let DOM = {};
            let canvasCtx = null;
            let canvasWidth = 0;
            let canvasHeight = 0;
            let fireTrail = [];
            let planeX = 0;
            let planeY = 0;
            let explosion = { active: false, x: 0, y: 0, radius: 0 };
            let gameLoopInterval = null;

            const state = {
                status: 'WAITING',
                multiplier: 1.00,
                roundId: 0,
                countdown: 10,
                crashPoint: 0,
                isCrashed: false,
                hasBet: false,
                hasCashedOut: false,
                balance: window.currentUser?.balance || CONFIG.initialBalance,
                graphData: [{ multiplier: 1.00 }],
                isConnected: false,
                cashoutPending: false,
                socket: null,
                running: false,
                betAmount: 10,
                username: window.currentUser?.username || 'Player'
            };

            function getSpeed() {
                if (state.graphData.length < 2) return 0;
                const last = state.graphData[state.graphData.length - 1].multiplier;
                const prev = state.graphData[state.graphData.length - 2].multiplier;
                return last - prev;
            }

            function showToast(message, type = 'info') {
                const old = document.querySelector('.crash-game-toast');
                if (old) old.remove();
                const toast = document.createElement('div');
                toast.className = 'crash-game-toast ' + type;
                toast.textContent = message;
                document.body.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(-50%) translateY(20px)';
                    toast.style.transition = 'all 0.3s ease';
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }

            function createGameHTML() {
                const app = document.getElementById('crash-game-app');
                if (!app) {
                    console.error('❌ App container not found');
                    return false;
                }

                app.innerHTML = `
                    <div class="crash-game-widget">
                        <div class="crash-game-header">
                            <div class="crash-game-title">
                                <span class="plane-icon">✈️</span> AVIATOR
                            </div>
                            <div class="header-right">
                                <div class="user-info">
                                    👤 <span class="username">${state.username}</span>
                                </div>
                                <button class="logout-btn" onclick="logout()">Logout</button>
                                <div class="crash-game-round-info" id="roundInfo">Round #0</div>
                            </div>
                        </div>
                        <div class="crash-game-multiplier">
                            <div class="value waiting" id="multiplierDisplay">1.00<span class="x-symbol">x</span></div>
                        </div>
                        <div class="crash-game-canvas">
                            <canvas id="gameCanvas"></canvas>
                            <div class="crash-game-status waiting" id="statusBadge">⏳ Waiting</div>
                            <div class="crash-game-countdown" id="countdownDisplay">10</div>
                        </div>
                        <div class="crash-game-panel">
                            <div class="crash-game-left">
                                <div class="crash-game-balance">
                                    <span class="label">💰 Balance</span>
                                    <span class="amount" id="balanceDisplay">$${state.balance.toFixed(2)}</span>
                                </div>
                                <div class="crash-game-controls">
                                    <div class="input-group">
                                        <input type="number" id="betAmount" value="10" min="0.1" step="1">
                                    </div>
                                    <div class="btn-group">
                                        <button class="crash-game-btn quick" data-amount="1">+1</button>
                                        <button class="crash-game-btn quick" data-amount="5">+5</button>
                                        <button class="crash-game-btn quick" data-amount="10">+10</button>
                                        <button class="crash-game-btn quick" data-amount="50">+50</button>
                                    </div>
                                    <div class="btn-group" style="margin-top:6px;">
                                        <button class="crash-game-btn place" id="placeBetBtn">Place Bet</button>
                                        <button class="crash-game-btn cashout" id="cashoutBtn" disabled>CASH OUT</button>
                                    </div>
                                </div>
                            </div>
                            <div class="crash-game-right">
                                <div class="crash-game-player-list" id="playerList">
                                    <div style="color:#8892b0;text-align:center;padding:20px;font-size:13px;">Waiting for players...</div>
                                </div>
                            </div>
                        </div>
                        <div class="crash-game-live-bets" id="liveBets">
                            <div class="crash-game-bet-feed-empty">Waiting for bets...</div>
                        </div>
                        <div class="crash-game-history">
                            <div class="title">📊 Previous Rounds</div>
                            <div class="grid" id="historyGrid">
                                <span class="item">No history</span>
                            </div>
                        </div>
                    </div>
                `;

                // Get DOM references
                DOM = {
                    multiplier: document.getElementById('multiplierDisplay'),
                    statusBadge: document.getElementById('statusBadge'),
                    roundInfo: document.getElementById('roundInfo'),
                    balance: document.getElementById('balanceDisplay'),
                    betAmount: document.getElementById('betAmount'),
                    placeBet: document.getElementById('placeBetBtn'),
                    cashout: document.getElementById('cashoutBtn'),
                    liveBets: document.getElementById('liveBets'),
                    historyGrid: document.getElementById('historyGrid'),
                    canvas: document.getElementById('gameCanvas'),
                    countdown: document.getElementById('countdownDisplay'),
                    playerList: document.getElementById('playerList')
                };

                // Verify all elements exist
                for (let key in DOM) {
                    if (!DOM[key]) {
                        console.error(`❌ DOM element ${key} not found`);
                        return false;
                    }
                }

                console.log('✅ Game HTML created successfully');
                return true;
            }

            function setupEventListeners() {
                DOM.placeBet.onclick = (e) => { e.preventDefault(); handlePlaceBet(); };
                DOM.cashout.onclick = (e) => { e.preventDefault(); handleCashOut(); };

                document.querySelectorAll('.crash-game-btn.quick').forEach(btn => {
                    btn.onclick = (e) => {
                        e.preventDefault();
                        const amount = parseFloat(btn.dataset.amount) || 0;
                        let cur = parseFloat(DOM.betAmount.value) || 0;
                        let val = Math.max(0.1, cur + amount);
                        if (val > state.balance) val = state.balance;
                        DOM.betAmount.value = val;
                        state.betAmount = val;
                    };
                });

                DOM.betAmount.onchange = function() {
                    let val = parseFloat(this.value) || 0.1;
                    if (val < 0.1) val = 0.1;
                    if (val > state.balance) {
                        val = state.balance;
                        showToast('Amount exceeds balance!', 'error');
                    }
                    this.value = val;
                    state.betAmount = val;
                };

                console.log('✅ Event listeners set up');
            }

            function handlePlaceBet() {
                const amount = parseFloat(DOM.betAmount.value);
                if (!amount || amount <= 0) { showToast('Enter valid amount', 'error'); return; }
                if (amount > state.balance) { showToast('Insufficient balance!', 'error'); return; }
                if (state.status !== 'WAITING') { showToast('Bets are closed', 'error'); return; }
                if (state.hasBet) { showToast('Bet already placed', 'info'); return; }
                if (!state.socket || !state.socket.connected) {
                    showToast('Connecting...', 'info');
                    return;
                }

                state.betAmount = amount;
                state.hasBet = true;
                state.hasCashedOut = false;
                state.balance -= amount;

                DOM.balance.textContent = '$' + state.balance.toFixed(2);
                DOM.placeBet.disabled = true;
                DOM.placeBet.textContent = 'BET PLACED';
                DOM.betAmount.disabled = true;

                showToast('✅ Bet placed: $' + amount.toFixed(2), 'success');
                state.socket.emit('bet:place', { amount: amount });
            }

            function handleCashOut() {
                if (!state.running) {
                    showToast('Round not running', 'error');
                    return;
                }
                if (!state.hasBet) {
                    showToast('No bet placed', 'error');
                    return;
                }
                if (state.hasCashedOut) {
                    showToast('Already cashed out', 'info');
                    return;
                }
                if (state.cashoutPending) return;

                const winnings = state.betAmount * state.multiplier;
                state.balance += winnings;
                state.hasCashedOut = true;
                state.cashoutPending = true;

                DOM.balance.textContent = '$' + state.balance.toFixed(2);
                DOM.cashout.textContent = '✅ CASHED';
                DOM.cashout.disabled = true;
                DOM.cashout.classList.remove('cashing');

                showToast('💰 Cashed out at ' + state.multiplier.toFixed(2) + 'x - Won $' + winnings.toFixed(2), 'success');

                if (state.socket && state.socket.connected) {
                    state.socket.emit('bet:cashout');
                } else {
                    state.cashoutPending = false;
                }

                setTimeout(() => updateUI(), 100);
            }

            function startRound() {
                state.status = 'RUNNING';
                state.running = true;
                state.multiplier = 1.00;
                state.isCrashed = false;
                state.hasCashedOut = false;
                state.cashoutPending = false;
                state.hasBet = false;
                state.graphData = [{ multiplier: 1.00 }];
                fireTrail = [];
                explosion.active = false;

                DOM.cashout.disabled = false;
                DOM.cashout.textContent = 'CASH OUT';
                DOM.cashout.classList.add('cashing');
                DOM.placeBet.disabled = false;
                DOM.placeBet.textContent = 'Place Bet';
                DOM.betAmount.disabled = false;

                updateUI();
                showToast('🚀 Round started!', 'success');
            }

            function initCanvas() {
                if (!DOM.canvas) {
                    console.error('❌ Canvas element not found');
                    return;
                }
                
                const rect = DOM.canvas.parentElement.getBoundingClientRect();
                const width = Math.min(rect.width || 800, 800);
                const height = 400;
                
                canvasWidth = DOM.canvas.width = width;
                canvasHeight = DOM.canvas.height = height;
                canvasCtx = DOM.canvas.getContext('2d');
                
                console.log(`✅ Canvas initialized: ${canvasWidth}x${canvasHeight}`);
                drawGraph();
            }

            function drawGraph() {
                if (!canvasCtx) return;
                
                const ctx = canvasCtx;
                const w = canvasWidth || 800;
                const h = canvasHeight || 400;

                ctx.clearRect(0, 0, w, h);
                ctx.fillStyle = "#0b1026";
                ctx.fillRect(0, 0, w, h);

                // Grid
                ctx.strokeStyle = "rgba(255,255,255,0.04)";
                ctx.lineWidth = 1;
                for (let x = 0; x < w; x += 60) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, h);
                    ctx.stroke();
                }
                for (let y = 0; y < h; y += 60) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(w, y);
                    ctx.stroke();
                }

                if (state.status === "WAITING") {
                    ctx.fillStyle = "rgba(255,255,255,0.2)";
                    ctx.font = "22px Arial";
                    ctx.textAlign = "center";
                    ctx.fillText(`Next round in ${state.countdown}s`, w / 2, h / 2);
                    return;
                }

                if (state.graphData.length < 2) return;

                let max = Math.max(...state.graphData.map(p => p.multiplier));
                if (state.crashPoint > max) max = state.crashPoint;
                if (max < 2) max = 2;
                const scaleY = h / (max - 1);

                const lastIndex = state.graphData.length - 1;
                planeX = (lastIndex / (state.graphData.length + 5)) * w;
                planeY = h - ((state.graphData[lastIndex].multiplier - 1) * scaleY);

                // Draw curve
                ctx.beginPath();
                for (let i = 0; i < state.graphData.length - 1; i++) {
                    const p0 = state.graphData[i];
                    const p1 = state.graphData[i + 1];
                    const x0 = (i / (state.graphData.length + 5)) * w;
                    const y0 = h - ((p0.multiplier - 1) * scaleY);
                    const x1 = ((i + 1) / (state.graphData.length + 5)) * w;
                    const y1 = h - ((p1.multiplier - 1) * scaleY);
                    const cpX = (x0 + x1) / 2;
                    if (i === 0) ctx.moveTo(x0, y0);
                    ctx.quadraticCurveTo(cpX, y0, x1, y1);
                }

                ctx.strokeStyle = "#ffcc00";
                ctx.lineWidth = 2.5;
                ctx.shadowColor = "rgba(255,204,0,0.2)";
                ctx.shadowBlur = 10;
                ctx.stroke();
                ctx.shadowBlur = 0;

                // Fill
                ctx.lineTo(w, h);
                ctx.lineTo(0, h);
                ctx.closePath();
                const grad = ctx.createLinearGradient(0, 0, 0, h);
                grad.addColorStop(0, "rgba(255,204,0,0.12)");
                grad.addColorStop(1, "rgba(255,204,0,0.01)");
                ctx.fillStyle = grad;
                ctx.fill();

                // Fire trail
                if (state.status === "RUNNING") {
                    fireTrail.push({ x: planeX, y: planeY });
                    if (fireTrail.length > 25) fireTrail.shift();
                    for (let i = 0; i < fireTrail.length; i++) {
                        const p = fireTrail[i];
                        const alpha = (i / fireTrail.length) * 0.8;
                        const size = 3 + (i / fireTrail.length) * 4;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255,150,50,${alpha})`;
                        ctx.fill();
                    }
                }

                // Plane
                if (state.status === "RUNNING") {
                    ctx.save();
                    ctx.translate(planeX, planeY);
                    const speed = getSpeed();
                    const angle = Math.min(0.6, speed * 8);
                    ctx.rotate(-angle);

                    ctx.fillStyle = "#ffffff";
                    ctx.shadowColor = "rgba(255,204,0,0.3)";
                    ctx.shadowBlur = 15;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(-14, -5);
                    ctx.lineTo(-10, 0);
                    ctx.lineTo(-14, 5);
                    ctx.closePath();
                    ctx.fill();

                    ctx.fillStyle = "#dddddd";
                    ctx.shadowBlur = 0;
                    ctx.fillRect(-10, -2, 6, 4);
                    ctx.fillStyle = "#88ccff";
                    ctx.beginPath();
                    ctx.arc(-4, 0, 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                // Explosion
                if (state.status === "CRASHED" && explosion.active) {
                    explosion.radius += 4;
                    ctx.beginPath();
                    ctx.arc(explosion.x, explosion.y, explosion.radius, 0, Math.PI * 2);
                    const eg = ctx.createRadialGradient(explosion.x, explosion.y, 0, explosion.x, explosion.y, explosion.radius);
                    eg.addColorStop(0, "rgba(255,200,50,0.6)");
                    eg.addColorStop(0.5, "rgba(255,100,0,0.4)");
                    eg.addColorStop(1, "rgba(255,50,0,0)");
                    ctx.fillStyle = eg;
                    ctx.fill();
                    if (explosion.radius > 60) explosion.active = false;
                }

                // Crash line
                if (state.status === "CRASHED") {
                    const crashY = h - ((state.crashPoint - 1) * scaleY);
                    ctx.setLineDash([6, 6]);
                    ctx.strokeStyle = "#ff3b3b";
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(0, crashY);
                    ctx.lineTo(w, crashY);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    ctx.fillStyle = "#ff4757";
                    ctx.font = "bold 15px Arial";
                    ctx.textAlign = "right";
                    ctx.fillText(state.crashPoint.toFixed(2) + "x", w - 10, crashY - 8);
                }

                // Live label
                if (state.status === "RUNNING") {
                    ctx.fillStyle = "#ffffff";
                    ctx.font = "bold 14px Arial";
                    ctx.textAlign = "right";
                    ctx.shadowColor = "rgba(0,0,0,0.5)";
                    ctx.shadowBlur = 8;
                    ctx.fillText(state.multiplier.toFixed(2) + "x", w - 12, planeY - 15);
                    ctx.shadowBlur = 0;
                }
            }

            function updateUI() {
                if (!DOM.multiplier) {
                    console.warn('⚠️ DOM not ready for UI update');
                    return;
                }

                if (state.status === 'WAITING') {
                    DOM.multiplier.className = 'value waiting';
                    DOM.multiplier.innerHTML = state.countdown + '<span class="x-symbol">s</span>';
                } else if (state.status === 'RUNNING') {
                    DOM.multiplier.className = 'value running';
                    DOM.multiplier.innerHTML = state.multiplier.toFixed(2) + '<span class="x-symbol">x</span>';
                } else {
                    DOM.multiplier.className = 'value crashed';
                    DOM.multiplier.innerHTML = '💥 ' + state.crashPoint.toFixed(2) + '<span class="x-symbol">x</span>';
                }

                DOM.statusBadge.className = 'crash-game-status ' + state.status.toLowerCase();
                const labels = { WAITING: '⏳ Waiting', RUNNING: '🟢 Running', CRASHED: '💥 Crashed' };
                DOM.statusBadge.textContent = labels[state.status] || state.status;
                DOM.roundInfo.textContent = 'Round #' + state.roundId;
                DOM.balance.className = 'amount ' + (state.balance < CONFIG.initialBalance ? 'negative' : '');
                DOM.balance.textContent = '$' + state.balance.toFixed(2);

                const canCashout = state.running && state.hasBet && !state.hasCashedOut && !state.cashoutPending;
                DOM.cashout.disabled = !canCashout;
                if (canCashout) {
                    DOM.cashout.textContent = '💰 CASH OUT';
                    DOM.cashout.classList.add('cashing');
                } else if (state.hasCashedOut) {
                    DOM.cashout.textContent = '✅ CASHED';
                    DOM.cashout.classList.remove('cashing');
                } else {
                    DOM.cashout.textContent = 'CASH OUT';
                    DOM.cashout.classList.remove('cashing');
                }

                const canPlaceBet = state.status === 'WAITING' && !state.hasBet && state.balance > 0;
                DOM.placeBet.disabled = !canPlaceBet;
                DOM.betAmount.disabled = state.status !== 'WAITING' || state.hasBet;

                if (state.status === 'WAITING') {
                    DOM.countdown.textContent = state.countdown;
                    DOM.countdown.className = 'crash-game-countdown active';
                } else {
                    DOM.countdown.className = 'crash-game-countdown';
                }

                drawGraph();
            }

            function addHistoryItem(multiplier) {
                if (!DOM.historyGrid) return;
                const emptyMsg = DOM.historyGrid.querySelector('.item');
                if (emptyMsg && emptyMsg.textContent === 'No history') {
                    DOM.historyGrid.innerHTML = '';
                }
                const item = document.createElement('span');
                item.className = 'item ' + (multiplier >= 2 ? 'high' : 'low');
                item.textContent = multiplier.toFixed(2) + 'x';
                DOM.historyGrid.prepend(item);
                while (DOM.historyGrid.children.length > 20) {
                    DOM.historyGrid.removeChild(DOM.historyGrid.lastChild);
                }
            }

            function setupSocket() {
                try {
                    // Get token from cookie
                    const getToken = () => {
                        const cookies = document.cookie.split(';');
                        for (let cookie of cookies) {
                            const [name, value] = cookie.trim().split('=');
                            if (name === 'token') return value;
                        }
                        return null;
                    };

                    const token = getToken();
                    if (!token) {
                        console.error('❌ No token found');
                        window.location.href = '/login';
                        return;
                    }

                    console.log('🔌 Connecting to socket with auth...');
                    
                   state.socket = io('wss://crash-game-upgu.onrender.com', {
                        transports: ['websocket', 'polling'],
                        reconnection: true,
                        reconnectionAttempts: 5,
                        reconnectionDelay: 2000,
                        auth: { token: token }
                    });

                    state.socket.on('connect', () => {
                        state.isConnected = true;
                        console.log('✅ Socket connected');
                        showToast('Connected!', 'success');
                        state.socket.emit('game:history');
                        updateUI();
                    });

                    state.socket.on('connect_error', (error) => {
                        state.isConnected = false;
                        console.error('❌ Socket connection error:', error);
                        if (error.message === 'Authentication required') {
                            window.location.href = '/login';
                        } else {
                            showToast('Connection failed', 'error');
                        }
                    });

                    state.socket.on('disconnect', () => {
                        state.isConnected = false;
                        console.log('🔌 Socket disconnected');
                        showToast('Disconnected', 'error');
                    });

                    state.socket.on('game:state', (data) => {
                        state.roundId = data.roundId || 0;
                        state.status = data.status || 'WAITING';
                        state.multiplier = data.multiplier || 1.00;
                        state.crashPoint = data.crashPoint || 0;
                        state.countdown = data.countdown || 10;
                        state.isCrashed = data.status === 'CRASHED';
                        state.running = data.status === 'RUNNING';
                        updateUI();
                    });

                    state.socket.on('game:countdown', (data) => {
                        state.roundId = data.roundId || 0;
                        state.status = 'WAITING';
                        state.countdown = data.countdown || 5;
                        state.isCrashed = false;
                        state.hasBet = false;
                        state.hasCashedOut = false;
                        state.cashoutPending = false;
                        state.running = false;
                        if (DOM.cashout) {
                            DOM.cashout.disabled = true;
                            DOM.cashout.textContent = 'CASH OUT';
                            DOM.cashout.classList.remove('cashing');
                        }
                        updateUI();
                    });

                    state.socket.on('game:start', (data) => {
                        startRound();
                    });

                    state.socket.on('game:update', (data) => {
                        if (state.status === 'RUNNING') {
                            state.multiplier = data.multiplier || 1;
                            state.graphData.push({ multiplier: state.multiplier });
                            if (state.graphData.length > 120) state.graphData.shift();
                            updateUI();
                        }
                    });

                    state.socket.on('game:crash', (data) => {
                        state.status = 'CRASHED';
                        state.crashPoint = data.multiplier || 1;
                        state.isCrashed = true;
                        state.running = false;
                        state.cashoutPending = false;
                        state.graphData.push({ multiplier: state.crashPoint });
                        explosion.active = true;
                        explosion.x = planeX || 600;
                        explosion.y = planeY || 200;
                        explosion.radius = 0;

                        if (DOM.cashout) {
                            DOM.cashout.disabled = true;
                            DOM.cashout.textContent = 'CASHED OUT';
                            DOM.cashout.classList.remove('cashing');
                        }

                        updateUI();
                        addHistoryItem(state.crashPoint);

                        if (!state.hasCashedOut && state.hasBet) {
                            showToast('💥 Crashed at ' + state.crashPoint.toFixed(2) + 'x', 'error');
                            state.hasBet = false;
                        }

                        setTimeout(() => {
                            state.graphData = [];
                            fireTrail = [];
                            explosion.active = false;
                            state.status = 'WAITING';
                            updateUI();
                        }, 500);
                    });

                    state.socket.on('bet:confirmed', (data) => {
                        state.hasBet = true;
                        state.balance = data.balance || state.balance;
                        if (DOM.placeBet) {
                            DOM.placeBet.disabled = true;
                            DOM.placeBet.textContent = 'BET PLACED';
                        }
                        if (DOM.betAmount) {
                            DOM.betAmount.disabled = true;
                        }
                        updateUI();
                    });

                    state.socket.on('bet:cashout:confirmed', (data) => {
                        state.hasCashedOut = true;
                        state.balance = data.balance || state.balance;
                        state.cashoutPending = false;
                        if (DOM.cashout) {
                            DOM.cashout.textContent = '✅ CASHED';
                            DOM.cashout.disabled = true;
                            DOM.cashout.classList.remove('cashing');
                        }
                        updateUI();
                        showToast('💰 Cashed at ' + (data.multiplier || 0).toFixed(2) + 'x - Won $' + (data.payout || 0).toFixed(2), 'success');
                    });

                    state.socket.on('bet:lost', (data) => {
                        state.hasBet = false;
                        state.balance = data.balance || state.balance;
                        updateUI();
                    });

                    state.socket.on('bet:error', (data) => {
                        state.cashoutPending = false;
                        showToast('❌ ' + data.error, 'error');
                        updateUI();
                    });

                    state.socket.on('game:history:data', (data) => {
                        if (data.history && data.history.length > 0) {
                            DOM.historyGrid.innerHTML = '';
                            data.history.forEach(h => addHistoryItem(h.crashPoint));
                        }
                    });

                    state.socket.on('player:data', (data) => {
                        if (data) {
                            state.balance = data.balance;
                            updateUI();
                        }
                    });

                    state.socket.on('player:list', (data) => {
                        if (data && data.length > 0) {
                            let html = '';
                            let betsHtml = '';
                            data.forEach(player => {
                                const status = player.cashedOut ? 'cashed' : 'waiting';
                                const statusText = player.cashedOut ? '✅ Cashed' : '⏳ Bet';
                                html += `<div class="player-item">
                                    <span class="name">👤 ${player.name}</span>
                                    <span class="bet-amount">$${player.betAmount.toFixed(2)}</span>
                                    <span class="status-badge ${status}">${statusText}</span>
                                </div>`;
                                const dotClass = player.cashedOut ? 'cashed' : '';
                                betsHtml += `<span class="crash-game-bet-item">
                                    <span class="player">${player.name}</span>
                                    <span>$${player.betAmount.toFixed(2)}</span>
                                    <span class="status ${dotClass || 'active'}">${player.cashedOut ? '✅' : '🟢'}</span>
                                </span>`;
                            });
                            DOM.playerList.innerHTML = html;
                            DOM.liveBets.innerHTML = betsHtml;
                        } else {
                            DOM.playerList.innerHTML = '<div style="color:#8892b0;text-align:center;padding:20px;font-size:13px;">Waiting for players...</div>';
                            DOM.liveBets.innerHTML = '<div class="crash-game-bet-feed-empty">Waiting for bets...</div>';
                        }
                    });

                } catch (error) {
                    console.error('❌ Socket setup error:', error);
                }
            }

            function init() {
                console.log('🚀 Initializing game...');
                
                try {
                    // Create game HTML
                    if (!createGameHTML()) {
                        console.error('❌ Failed to create game HTML');
                        return;
                    }

                    // Setup event listeners
                    setupEventListeners();

                    // Initialize canvas
                    setTimeout(initCanvas, 100);

                    // Setup socket
                    setupSocket();

                    // Handle resize
                    let resizeTimeout;
                    window.addEventListener('resize', () => {
                        clearTimeout(resizeTimeout);
                        resizeTimeout = setTimeout(() => initCanvas(), 200);
                    });

                    // Start UI update loop
                    setTimeout(updateUI, 200);
                    
                    // Game loop
                    if (gameLoopInterval) clearInterval(gameLoopInterval);
                    gameLoopInterval = setInterval(() => {
                        if (explosion.active) {
                            explosion.radius += 3;
                            if (explosion.radius > 60) explosion.active = false;
                        }
                        updateUI();
                    }, 50);

                    console.log('✅ Game initialized successfully');
                    
                } catch (error) {
                    console.error('❌ Game initialization error:', error);
                    showToast('Failed to initialize game', 'error');
                }
            }

            // Start the game
            init();
        }
    </script>
</body>
</html>
