<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aviator Game</title>

<style>
body {
    background: #0a0e27;
    font-family: Arial;
    color: white;
    display: flex;
    justify-content: center;
    padding: 20px;
}

.container {
    width: 800px;
}

#multiplier {
    font-size: 60px;
    text-align: center;
    color: #ffd93d;
}

button {
    padding: 10px;
    margin-top: 10px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="container">

<h2>Aviator</h2>

<div id="multiplier">1.00x</div>

<div>
    Balance: <span id="balance">0</span>
</div>

<input type="number" id="betAmount" value="10">

<br>

<button id="betBtn">Place Bet</button>
<button id="cashoutBtn" disabled>Cashout</button>

</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<script>
// =======================
// GET COOKIE
// =======================
function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) return parts.pop().split(';').shift();
}

// =======================
// STATE
// =======================
let socket;
let balance = 0;
let hasBet = false;
let running = false;

// =======================
// DOM
// =======================
const multiplierEl = document.getElementById('multiplier');
const balanceEl = document.getElementById('balance');
const betInput = document.getElementById('betAmount');
const betBtn = document.getElementById('betBtn');
const cashoutBtn = document.getElementById('cashoutBtn');

// =======================
// CONNECT SOCKET
// =======================
function connectSocket() {
    const token = getCookie('token');

    socket = io(window.location.origin, {
        auth: { token }
    });

    socket.on('connect', () => {
        console.log('Connected');
    });

    socket.on('connect_error', (err) => {
        console.error('Socket error:', err.message);
    });

    // =======================
    // SERVER EVENTS
    // =======================

    socket.on('player:data', (data) => {
        balance = data.balance;
        balanceEl.textContent = balance.toFixed(2);
    });

    socket.on('game:update', (data) => {
        multiplierEl.textContent = data.multiplier.toFixed(2) + "x";
    });

    socket.on('game:start', () => {
        running = true;
        hasBet = false;

        cashoutBtn.disabled = false;
        betBtn.disabled = false;
    });

    socket.on('game:crash', (data) => {
        running = false;
        multiplierEl.textContent = data.multiplier.toFixed(2) + "x 💥";

        cashoutBtn.disabled = true;
        betBtn.disabled = false;
        hasBet = false;
    });

    socket.on('bet:confirmed', (data) => {
        balance = data.balance;
        balanceEl.textContent = balance.toFixed(2);

        hasBet = true;
        betBtn.disabled = true;
    });

    socket.on('bet:cashout:confirmed', (data) => {
        balance = data.balance;
        balanceEl.textContent = balance.toFixed(2);

        cashoutBtn.disabled = true;
        hasBet = false;
    });

    socket.on('bet:lost', (data) => {
        balance = data.balance;
        balanceEl.textContent = balance.toFixed(2);

        hasBet = false;
        cashoutBtn.disabled = true;
    });

    socket.on('bet:error', (err) => {
        alert(err.error);
    });
}

// =======================
// BET
// =======================
betBtn.onclick = () => {
    const amount = parseFloat(betInput.value);

    if (!amount || amount <= 0) {
        alert("Invalid amount");
        return;
    }

    if (amount > balance) {
        alert("Not enough balance");
        return;
    }

    if (!socket || !socket.connected) {
        alert("Not connected");
        return;
    }

    socket.emit('bet:place', { amount });
};

// =======================
// CASHOUT
// =======================
cashoutBtn.onclick = () => {
    if (!running || !hasBet) return;

    socket.emit('bet:cashout');
};

// =======================
// START
// =======================
connectSocket();

</script>

</body>
</html>
