<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚀 Aviator Pro</title>

<style>
body {
    margin:0;
    font-family:Arial, sans-serif;
    background:#0b1026;
    color:#fff;
}

.container {
    max-width:900px;
    margin:auto;
    padding:20px;
}

canvas {
    width:100%;
    height:400px;
    background:#0b1026;
    border-radius:10px;
}

.top {
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
}

.balance { color:#ffd93d; }

.controls {
    display:flex;
    gap:10px;
    margin-top:10px;
}

button {
    padding:10px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.bet { background:#1dd1a1; }
.cash { background:#ff4757; }

.multiplier {
    font-size:40px;
    text-align:center;
    margin:10px 0;
}
</style>
</head>

<body>

<div class="container">

<div class="top">
    <div>👤 Player</div>
    <div class="balance" id="balance">$1000.00</div>
</div>

<div class="multiplier" id="multiplier">1.00x</div>

<canvas id="canvas"></canvas>

<div class="controls">
    <input type="number" id="betAmount" value="10" min="1">
    <button class="bet" id="betBtn">BET</button>
    <button class="cash" id="cashBtn" disabled>CASH OUT</button>
</div>

</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = 900;
canvas.height = 400;

const UI = {
    multiplier: document.getElementById("multiplier"),
    balance: document.getElementById("balance"),
    betInput: document.getElementById("betAmount"),
    betBtn: document.getElementById("betBtn"),
    cashBtn: document.getElementById("cashBtn")
};

const state = {
    status: "WAITING",
    multiplier: 1,
    crashPoint: 0,
    balance: 1000,
    bet: 0,
    hasBet:false,
    cashed:false,
    graph: [],
    socket:null,
    connected:false
};

// ===== MULTIPLIER LOGIC =====
function nextMultiplier(prev){
    return prev * (1 + (Math.random()*0.03 + 0.01));
}

// ===== CRASH LOGIC =====
function shouldCrash(m){
    return Math.random() < (0.002 * m);
}

// ===== DRAW =====
let planeX=0, planeY=0;

function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    if(state.graph.length < 2) return;

    let max = Math.max(...state.graph);
    if(max < 2) max = 2;

    const scaleY = canvas.height/(max-1);

    ctx.beginPath();

    state.graph.forEach((m,i)=>{
        const x = (i/state.graph.length)*canvas.width;
        const y = canvas.height - ((m-1)*scaleY);

        if(i===0) ctx.moveTo(x,y);
        else ctx.lineTo(x,y);

        planeX=x;
        planeY=y;
    });

    ctx.strokeStyle="#ffd93d";
    ctx.lineWidth=2;
    ctx.stroke();

    // plane
    ctx.fillStyle="#fff";
    ctx.beginPath();
    ctx.arc(planeX,planeY,5,0,Math.PI*2);
    ctx.fill();
}

// ===== UI =====
function updateUI(){
    UI.multiplier.innerText = state.status==="RUNNING"
        ? state.multiplier.toFixed(2)+"x"
        : state.status==="CRASHED"
        ? "💥 "+state.crashPoint.toFixed(2)+"x"
        : "WAITING";

    UI.balance.innerText="$"+state.balance.toFixed(2);

    UI.cashBtn.disabled = !(state.hasBet && !state.cashed && state.status==="RUNNING");
}

// ===== BET =====
UI.betBtn.onclick=()=>{
    const amt=parseFloat(UI.betInput.value);
    if(!amt || amt>state.balance) return;

    state.bet=amt;
    state.balance-=amt;
    state.hasBet=true;
    state.cashed=false;

    updateUI();
};

// ===== CASH OUT =====
UI.cashBtn.onclick=()=>{
    if(state.cashed || !state.hasBet) return;

    const win = state.bet * state.multiplier;
    state.balance += win;

    state.cashed=true;

    updateUI();
};

// ===== GAME LOOP =====
function loop(){

    if(state.status==="RUNNING"){
        state.multiplier = nextMultiplier(state.multiplier);
        state.graph.push(state.multiplier);

        if(state.graph.length>80) state.graph.shift();

        if(shouldCrash(state.multiplier)){
            state.status="CRASHED";
            state.crashPoint=state.multiplier;
        }
    }

    draw();
    updateUI();

    requestAnimationFrame(loop);
}

// ===== ROUND CONTROL =====
function startRound(){
    state.status="RUNNING";
    state.multiplier=1;
    state.graph=[1];
    state.hasBet=false;
    state.cashed=false;
}

function waitNext(){
    state.status="WAITING";
    setTimeout(startRound,3000);
}

// ===== INIT =====
function init(){
    waitNext();

    setInterval(()=>{
        if(state.status==="CRASHED"){
            waitNext();
        }
    },3000);

    loop();
}

init();
</script>

</body>
</html>
