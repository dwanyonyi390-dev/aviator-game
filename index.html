      if (r < 0.45) return 1.6 + rand(0, 1.4);

      const el = document.createElement('div');
      el.className = 'toast ' + type;
      el.textContent = msg;
      document.body.appendChild(el);

    const fakeNames = ["Jay254", "CryptoKenya", "Moraa", "OtisX", "BetKing", "NairobiPro", "Shiro", "Kiprop", "Wanjiru", "Omondi"];

    function generateFakePlayers() {
      const count = Math.floor(Math.random() * 5) + 3;
      return Array.from({ length: count }, () => ({
        name: fakeNames[Math.floor(Math.random() * fakeNames.length)],
        betAmount: Math.floor(Math.random() * 80) + 10,

        <div class="history-area">

          <div class="history-grid" id="historyGrid">
            <span class="h-item">—</span>
          </div>
        </div>
      `;

      // cache refs
      $.multiplier = document.getElementById('multiplierDisplay');
      $.statusBadge = document.getElementById('statusBadge');
      $.roundBadge = document.getElementById('roundBadge');
      $.balance = document.getElementById('balanceDisplay');
      $.betInput = document.getElementById('betInput');
      $.placeBtn = document.getElementById('placeBtn');
      $.cashoutBtn = document.getElementById('cashoutBtn');
      $.canvas = document.getElementById('gameCanvas');
      $.countdown = document.getElementById('countdownOverlay');
      $.playerList = document.getElementById('playerList');
      $.liveFeed = document.getElementById('liveFeed');
      $.historyGrid = document.getElementById('historyGrid');
      $.plane = document.getElementById('plane');

      // events
      $.placeBtn.onclick = handlePlaceBet;
      $.cashoutBtn.onclick = handleCashOut;

      document.querySelectorAll('.quick-btns button').forEach(btn => {
        btn.onclick = () => {
          const amt = parseFloat(btn.dataset.amount) || 0;
          let cur = parseFloat($.betInput.value) || 0;

          if (val > state.balance) val = state.balance;
          $.betInput.value = val;
          state.betAmount = val;

        if (val < 0.1) val = 0.1;

          val = state.balance;
          showToast('Amount exceeds balance', 'error');
        }
        this.value = val;
        state.betAmount = val;
      };

      // canvas context
      const ctx = $.canvas.getContext('2d');
      const w = CONFIG.canvasWidth, h = CONFIG.canvasHeight;

      // draw function with smooth curve
      function drawGraph() {
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = '#080d1a';
        ctx.fillRect(0, 0, w, h);

        // grid
        ctx.strokeStyle = 'rgba(255,255,255,0.03)';
        ctx.lineWidth = 1;
        for (let x = 0; x < w; x += 60) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, h);
          ctx.stroke();
        }
        for (let y = 0; y < h; y += 60) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(w, y);
          ctx.stroke();
        }

        if (state.status === 'WAITING') {
          ctx.fillStyle = 'rgba(255,255,255,0.08)';

        }

        if (state.graphData.length < 2) {
          if ($.plane) $.plane.style.display = 'none';
          return;
        }

        let maxVal = Math.max(...state.graphData.map(p => p.multiplier), state.crashPoint || 1);
        if (maxVal < 2) maxVal = 2;
        const scaleY = h / (maxVal - 1);

        // smooth curve
        ctx.beginPath();
        for (let i = 0; i < state.graphData.length; i++) {
          const x = (i / (state.graphData.length + 4)) * w;
          const y = h - ((state.graphData[i].multiplier - 1) * scaleY);
          if (i === 0) {
            ctx.moveTo(x, y);
          } else {
            const prev = state.graphData[i - 1];
            const prevX = ((i - 1) / (state.graphData.length + 4)) * w;
            const prevY = h - ((prev.multiplier - 1) * scaleY);
            ctx.quadraticCurveTo(prevX, prevY, x, y);
          }
        }
        ctx.strokeStyle = '#f6c445';
        ctx.lineWidth = 2.8;
        ctx.shadowColor = 'rgba(246,196,69,0.25)';
        ctx.shadowBlur = 14;
        ctx.stroke();
        ctx.shadowBlur = 0;

        // fill
        ctx.lineTo(w, h);
        ctx.lineTo(0, h);
        ctx.closePath();
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, 'rgba(246,196,69,0.07)');
        grad.addColorStop(1, 'rgba(246,196,69,0.01)');
        ctx.fillStyle = grad;
        ctx.fill();

        // crash line
        if (state.status === 'CRASHED' && state.crashPoint > 1) {
          const cy = h - ((state.crashPoint - 1) * scaleY);
          ctx.setLineDash([5, 6]);
          ctx.strokeStyle = '#ff4d6d';
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.moveTo(0, cy);
          ctx.lineTo(w, cy);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillStyle = '#ff4d6d';
          ctx.font = 'bold 15px Inter, sans-serif';
          ctx.textAlign = 'right';
          ctx.fillText(state.crashPoint.toFixed(2) + 'x', w-12, cy-6);
        }

        // live label
        if (state.status === 'RUNNING' && state.graphData.length) {
          const last = state.graphData[state.graphData.length-1];
          const ly = h - ((last.multiplier - 1) * scaleY);
          ctx.fillStyle = '#f0f4ff';
          ctx.font = 'bold 16px Inter, sans-serif';
          ctx.textAlign = 'right';
          ctx.fillText(last.multiplier.toFixed(2) + 'x', w-12, ly-6);
        }

        // update plane position
        if ($.plane && state.status === 'RUNNING' && state.graphData.length > 1) {
          $.plane.style.display = 'block';
          const lastIdx = state.graphData.length - 1;
          const x = (lastIdx / (state.graphData.length + 4)) * w;
          const y = h - ((state.multiplier - 1) * scaleY);
          const rot = Math.min(state.multiplier * 8, 45);
          $.plane.style.transform = `translate(${x - 20}px, ${y - 20}px) rotate(${rot}deg)`;
        } else if ($.plane && state.status === 'CRASHED') {
          $.plane.style.display = 'block';
          const lastIdx = state.graphData.length - 1;
          const x = (lastIdx / (state.graphData.length + 4)) * w;
          const y = h - ((state.crashPoint - 1) * scaleY);
          $.plane.style.transform = `translate(${x - 20}px, ${y - 20}px) rotate(45deg)`;
        } else if ($.plane) {
          $.plane.style.display = 'none';
        }
      }

      // update UI from state
      function updateUI() {
        // multiplier
        const el = $.multiplier;
        if (state.status === 'WAITING') {
          el.className = 'multiplier-value waiting';
          el.innerHTML = `${state.countdown}<span class="x">s</span>`;
        } else if (state.status === 'RUNNING') {
          el.className = 'multiplier-value running';
          el.innerHTML = `${state.multiplier.toFixed(2)}<span class="x">x</span>`;
        } else {
          el.className = 'multiplier-value crashed';
          el.innerHTML = `💥 ${state.crashPoint.toFixed(2)}<span class="x">x</span>`;
        }

        // badge
        const sb = $.statusBadge;
        sb.className = 'game-status ' + state.status.toLowerCase();
        const labels = { WAITING: '⏳ Waiting', RUNNING: '🟢 Running', CRASHED: '💥 Crashed' };
        sb.textContent = labels[state.status] || state.status;

        // round
        $.roundBadge.textContent = `Round #${state.roundId}`;

        // balance
        $.balance.textContent = `$${state.balance.toFixed(2)}`;
        $.balance.className = 'balance-amount' + (state.balance < CONFIG.initialBalance ? ' negative' : '');

        // buttons
        const canPlace = state.status === 'WAITING' && !state.hasBet && state.balance > 0;
        $.placeBtn.disabled = !canPlace;
        $.betInput.disabled = state.status !== 'WAITING' || state.hasBet;

        const canCash = state.running && state.hasBet && !state.hasCashedOut && !state.cashoutPending;
        $.cashoutBtn.disabled = !canCash;
        if (canCash) {
          $.cashoutBtn.textContent = 'CASH OUT';
          $.cashoutBtn.classList.add('cashing');
        } else {
          $.cashoutBtn.classList.remove('cashing');
          if (state.hasCashedOut) $.cashoutBtn.textContent = '✅ CASHED';
          else $.cashoutBtn.textContent = 'CASH OUT';
        }

        // countdown
        if (state.status === 'WAITING') {
          $.countdown.textContent = state.countdown;
          $.countdown.className = 'countdown-overlay active';
        } else {
          $.countdown.className = 'countdown-overlay';
        }

        // audio: tick during running
        if (state.status === 'RUNNING') {
          document.getElementById('tickSound')?.play().catch(() => {});
        }
        if (state.status === 'CRASHED') {
          document.getElementById('crashSound')?.play().catch(() => {});
        }

        drawGraph();
      }

      // update players (fake multiplayer)
      function updatePlayers(players) {
        if (!players || !players.length) {
          const fake = generateFakePlayers();
          players = fake;
        }
        let html = '';
        let feedHtml = '';
        players.forEach(p => {
          const statusClass = p.cashedOut ? 'cashed' : (state.isCrashed ? 'lost' : 'waiting');
          const label = p.cashedOut ? '✅ cashed' : (state.isCrashed ? '💥 lost' : '⏳ bet');
          html += `<div class="player-item">
            <span class="pname">👤 ${p.name || 'anon'}</span>
            <span class="pbet">$${p.betAmount.toFixed(2)}</span>
            <span class="pstatus ${statusClass}">${label}</span>
          </div>`;
          const dotClass = p.cashedOut ? 'cashed' : (state.isCrashed ? 'lost' : '');
          feedHtml += `<span class="bet-chip">
            <span class="status-dot ${dotClass}"></span>
            ${p.name || 'anon'} $${p.betAmount.toFixed(2)}
          </span>`;
        });
        $.playerList.innerHTML = html;
        $.liveFeed.innerHTML = feedHtml || `<div class="empty-feed">no active bets</div>`;
      }

      // update history
      function addHistoryItem(mult) {
        const grid = $.historyGrid;
        if (grid.querySelector('.h-item')?.textContent === '—') grid.innerHTML = '';
        const el = document.createElement('span');
        el.className = 'h-item ' + (mult >= 2 ? 'high' : 'low');
        el.textContent = mult.toFixed(2) + 'x';
        grid.prepend(el);
        while (grid.children.length > CONFIG.historyLimit) grid.removeChild(grid.lastChild);
      }

      // ---------- game actions ----------
      function handlePlaceBet() {
        const amt = parseFloat($.betInput.value);
        if (!amt || amt <= 0) { showToast('Enter valid amount', 'error'); return; }
        if (amt > state.balance) { showToast('Insufficient balance', 'error'); return; }
        if (state.status !== 'WAITING') { showToast('Bets closed', 'error'); return; }
        if (state.hasBet) { showToast('Bet already placed', 'info'); return; }
        if (!state.socket || !state.socket.connected) {
          showToast('Connecting...', 'info');
          setupSocket();
          return;
        }
        state.betAmount = amt;
        state.hasBet = true;
        state.balance -= amt;
        state.socket.emit('bet:place', { amount: amt });
        updateUI();
        showToast(`✅ Bet $${amt.toFixed(2)} placed`, 'success');
      }

      function handleCashOut() {
        if (!state.running) { showToast('Round not running', 'error'); return; }
        if (!state.hasBet) { showToast('No bet placed', 'error'); return; }
        if (state.hasCashedOut) { showToast('Already cashed', 'info'); return; }
        if (state.cashoutPending) return;
        state.cashoutPending = true;
        const win = state.betAmount * state.multiplier;
        state.balance += win;
        state.hasCashedOut = true;
        state.socket?.emit('bet:cashout');
        showToast(`💰 Cashed at ${state.multiplier.toFixed(2)}x · +$${win.toFixed(2)}`, 'success');
        // flash effect
        document.body.style.background = 'radial-gradient(circle, #1f2937, #020617)';
        setTimeout(() => { document.body.style.background = ''; }, 300);
        updateUI();
      }

      // ---------- socket ----------
      function setupSocket() {
        if (state.socket) return;
        state.socket = io(CONFIG.serverUrl, { transports: ['websocket', 'polling'], reconnection: true });
        state.socket.on('connect', () => {
          state.connected = true;
          showToast('Connected', 'success');
          state.socket.emit('game:history');
        });
        state.socket.on('disconnect', () => {
          state.connected = false;
          showToast('Disconnected', 'error');
        });
        state.socket.on('game:state', data => {
          if (data) {
            state.roundId = data.roundId || state.roundId;
            state.status = data.status || 'WAITING';
            state.multiplier = data.multiplier || 1;
            state.crashPoint = data.crashPoint || 0;
            state.countdown = data.countdown || 8;
            state.isCrashed = data.status === 'CRASHED';
            state.running = data.status === 'RUNNING';
            if (state.status === 'WAITING') state.hasBet = false;
            updateUI();
          }
        });
        state.socket.on('game:countdown', data => {
          state.status = 'WAITING';
          state.countdown = data.countdown || 8;
          state.running = false;
          state.isCrashed = false;
          state.hasCashedOut = false;
          state.cashoutPending = false;
          state.hasBet = false;
          updateUI();
        });
        state.socket.on('game:start', data => {
          state.status = 'RUNNING';
          state.running = true;
          state.roundId = data.roundId || state.roundId;
          state.multiplier = 1.00;
          state.isCrashed = false;
          state.cashoutPending = false;
          state.graphData = [{ multiplier: 1.00 }];
          updateUI();
          showToast('🚀 Round started!', 'info');
        });
        state.socket.on('game:update', data => {
          if (state.status === 'RUNNING') {
            state.multiplier = data.multiplier || 1;
            state.graphData.push({ multiplier: state.multiplier });
            if (state.graphData.length > CONFIG.MAX_POINTS) state.graphData.shift();
            if (state.crashPoint > 0 && state.multiplier >= state.crashPoint) {
              state.status = 'CRASHED';
              state.isCrashed = true;
              state.running = false;
              state.crashPoint = state.multiplier;
              updateUI();
              addHistoryItem(state.crashPoint);
              if (!state.hasCashedOut && state.hasBet) {
                showToast(`💥 Crashed at ${state.crashPoint.toFixed(2)}x`, 'error');
              }
              setTimeout(() => {
                state.status = 'WAITING';
                state.graphData = [];
                state.running = false;
                updateUI();
              }, 600);
              return;
            }
            updateUI();
          }
        });
        state.socket.on('game:crash', data => {
          state.status = 'CRASHED';
          state.crashPoint = data.multiplier || 1;
          state.isCrashed = true;
          state.running = false;
          state.graphData.push({ multiplier: state.crashPoint });
          updateUI();
          addHistoryItem(state.crashPoint);
          if (!state.hasCashedOut && state.hasBet) {
            showToast(`💥 Crashed at ${state.crashPoint.toFixed(2)}x`, 'error');
          }
          setTimeout(() => {
            state.status = 'WAITING';
            state.graphData = [];
            state.running = false;
            updateUI();
          }, 600);
        });
        state.socket.on('bet:confirmed', data => {
          state.hasBet = true;
          state.balance = data.balance || state.balance;
          updateUI();
        });
        state.socket.on('bet:cashout:confirmed', data => {
          state.hasCashedOut = true;
          state.balance = data.balance || state.balance;
          state.cashoutPending = false;
          updateUI();
        });
        state.socket.on('bet:error', data => {
          state.cashoutPending = false;
          showToast('❌ ' + (data.error || 'bet error'), 'error');
          updateUI();
        });
        state.socket.on('player:list', data => {
          if (data && data.length) updatePlayers(data);
        });
        state.socket.on('game:history:data', data => {
          if (data?.history?.length) {
            $.historyGrid.innerHTML = '';
            data.history.forEach(h => addHistoryItem(h.crashPoint));
          }
        });
      }

      // ---------- init ----------
      function init() {
        render();
        setupSocket();

        // offline simulation with fake players and auto-bet
        setInterval(() => {
          // fake players every 2s
          if (!state.connected) {
            updatePlayers(generateFakePlayers());
          }
          // auto bet
          const auto = document.getElementById('autoBet');
          if (auto?.checked && state.status === 'WAITING' && !state.hasBet && state.balance > 0) {
            handlePlaceBet();
          }
        }, 2000);

        // countdown loop (offline fallback)
        setInterval(() => {
          if (!state.connected) {
            if (state.status === 'WAITING' && state.countdown > 0) {
              state.countdown--;
              updateUI();
            } else if (state.status === 'WAITING' && state.countdown <= 0 && !state.running) {
              state.crashPoint = generateCrashPoint();
              state.status = 'RUNNING';
              state.running = true;
              state.graphData = [{ multiplier: 1.00 }];
              updateUI();
              showToast('🚀 round started (offline)', 'info');
              let m = 1.00;
              const interval = setInterval(() => {
                if (state.status !== 'RUNNING') { clearInterval(interval); return; }
                m += 0.02 + Math.random() * 0.03;
                state.multiplier = m;
                state.graphData.push({ multiplier: m });
                if (m >= state.crashPoint) {
                  state.status = 'CRASHED';
                  state.isCrashed = true;
                  state.running = false;
                  state.crashPoint = m;
                  updateUI();
                  addHistoryItem(m);
                  if (!state.hasCashedOut && state.hasBet) {
                    showToast(`💥 crashed at ${m.toFixed(2)}x`, 'error');
                  }
                  setTimeout(() => {
                    state.status = 'WAITING';
                    state.graphData = [];
                    state.running = false;
                    state.countdown = 6;
                    state.hasBet = false;
                    state.hasCashedOut = false;
                    updateUI();
                  }, 500);
                  clearInterval(interval);
                  return;
                }
                updateUI();
              }, 100);
            }
          }
        }, 1000);

        setInterval(updateUI, 120);
        window.crash = { state, forceStart: () => { state.crashPoint = generateCrashPoint(); state.status = 'RUNNING'; state.running = true; state.graphData = [{ multiplier: 1.00 }]; updateUI(); } };
      }

      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
      else init();
    })();
  </script>
